<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Actividad Web</title>

<style>

body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:100px;
    background:white;
    color:black;
    transition:0.3s;
}

input{
    padding:10px;
    width:300px;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

</style>

</head>
<body>

<h2>Actividad Web</h2>

<input type="text" id="texto" placeholder="Escribe algo y presiona Enter">

<br>

<button onclick="cambiarColor()">Cambiar colores</button>

<script>

const input = document.getElementById("texto")

input.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        alert("Texto ingresado: " + input.value)

    }

})

let estado = 0

function cambiarColor(){

    estado++

    if(estado > 2){
        estado = 0
    }

    if(estado === 0){
        document.body.style.background = "white"
        document.body.style.color = "black"
    }

    if(estado === 1){
        document.body.style.background = "black"
        document.body.style.color = "white"
    }

    if(estado === 2){
        document.body.style.background = "skyblue"
        document.body.style.color = "red"
    }

}

</script>

</body>
</html>
